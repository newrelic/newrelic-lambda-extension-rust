name: Build Test Layers on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      # Trigger on Rust code changes
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # Trigger on scripts that affect layers
      - 'scripts/**'
      # Exclude documentation changes
      - '!**/*.md'
      - '!docs/**'
      - '!README.md'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  AWS_REGION: us-west-1
  TEST_MODE: "true"

jobs:
  build-test-layers:
    name: Build and Publish Test Layers
    runs-on: ubuntu-latest
    
    outputs:
      layers_created: ${{ steps.build_layers.outputs.layers_created }}
      extension_x86_arn: ${{ steps.capture_arns.outputs.extension_x86_arn }}
      extension_arm_arn: ${{ steps.capture_arns.outputs.extension_arm_arn }}
      python_x86_arn: ${{ steps.capture_arns.outputs.python_x86_arn }}
      python_arm_arn: ${{ steps.capture_arns.outputs.python_arm_arn }}
      nodejs_x86_arn: ${{ steps.capture_arns.outputs.nodejs_x86_arn }}
      nodejs_arm_arn: ${{ steps.capture_arns.outputs.nodejs_arm_arn }}
      java_x86_arn: ${{ steps.capture_arns.outputs.java_x86_arn }}
      java_arm_arn: ${{ steps.capture_arns.outputs.java_arm_arn }}
      dotnet_x86_arn: ${{ steps.capture_arns.outputs.dotnet_x86_arn }}
      dotnet_arm_arn: ${{ steps.capture_arns.outputs.dotnet_arm_arn }}
      ruby_x86_arn: ${{ steps.capture_arns.outputs.ruby_x86_arn }}
      ruby_arm_arn: ${{ steps.capture_arns.outputs.ruby_arm_arn }}
    
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Mask sensitive data
        run: |
          # Ensure AWS credentials are never printed
          echo "::add-mask::${{ secrets.AWS_ACCESS_KEY_ID }}"
          echo "::add-mask::${{ secrets.AWS_SECRET_ACCESS_KEY }}"

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-zigbuild for cross-compilation
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Add Rust targets
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            scripts/java/.gradle
            scripts/java/build
          key: ${{ runner.os }}-gradle-${{ hashFiles('scripts/java/**/*.gradle*', 'scripts/java/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: 'scripts/ruby'

      - name: Cache .NET agent downloads
        uses: actions/cache@v4
        with:
          path: /tmp/newrelic-dotnet-agent*.tar.gz
          key: ${{ runner.os }}-dotnet-agent-${{ hashFiles('scripts/createlayer.sh') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-agent-

      - name: Install dependencies
        run: |
          # Install jq for JSON parsing
          sudo apt-get update && sudo apt-get install -y jq
          
          # Install bundler for Ruby
          gem install bundler
          
          # Install AWS CLI
          pip3 install --upgrade pip awscli

      - name: Build and publish test layers
        id: build_layers
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          # Set environment variables for test mode
          export TEST_MODE="true"
          export LAYER_NAME_PREFIX="NRTestRustExtension"
          export BUCKET_PREFIX="nr-extension-test-layers"
          export REGIONS_X86_64="us-west-1 ca-central-1"
          export REGIONS_ARM64="us-west-1 ca-central-1"
          export LANGUAGES="extension python nodejs java dotnet ruby"
          
          # Run the unified script
          chmod +x scripts/createlayer.sh
          ./scripts/createlayer.sh
          
          # Capture layer ARNs (ensure no secrets are printed)
          if [ -f dist/nr_tmp_env.sh ]; then
            echo "✓ Layer ARNs generated successfully"
            # Count layers without printing credentials
            layer_count=$(grep -c "^export LAYER_ARN_" dist/nr_tmp_env.sh || echo "0")
            echo "✓ Created $layer_count layer ARN(s)"
            echo "layers_created=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Failed to generate layer ARNs"
            echo "layers_created=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Capture Layer ARNs
        id: capture_arns
        if: steps.build_layers.outputs.layers_created == 'true'
        run: |
          # Source the env file and export to GitHub outputs (ARNs only, no secrets)
          source dist/nr_tmp_env.sh
          echo "extension_x86_arn=${LAYER_ARN_EXTENSION_X86_64:-}" >> $GITHUB_OUTPUT
          echo "extension_arm_arn=${LAYER_ARN_EXTENSION_ARM64:-}" >> $GITHUB_OUTPUT
          echo "python_x86_arn=${LAYER_ARN_PYTHON_X86_64:-}" >> $GITHUB_OUTPUT
          echo "python_arm_arn=${LAYER_ARN_PYTHON_ARM64:-}" >> $GITHUB_OUTPUT
          echo "nodejs_x86_arn=${LAYER_ARN_NODEJS_X86_64:-}" >> $GITHUB_OUTPUT
          echo "nodejs_arm_arn=${LAYER_ARN_NODEJS_ARM64:-}" >> $GITHUB_OUTPUT
          echo "java_x86_arn=${LAYER_ARN_JAVA_X86_64:-}" >> $GITHUB_OUTPUT
          echo "java_arm_arn=${LAYER_ARN_JAVA_ARM64:-}" >> $GITHUB_OUTPUT
          echo "dotnet_x86_arn=${LAYER_ARN_DOTNET_X86_64:-}" >> $GITHUB_OUTPUT
          echo "dotnet_arm_arn=${LAYER_ARN_DOTNET_ARM64:-}" >> $GITHUB_OUTPUT
          echo "ruby_x86_arn=${LAYER_ARN_RUBY_X86_64:-}" >> $GITHUB_OUTPUT
          echo "ruby_arm_arn=${LAYER_ARN_RUBY_ARM64:-}" >> $GITHUB_OUTPUT

      - name: Comment on PR with Layer ARNs
        if: steps.build_layers.outputs.layers_created == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read the environment file with layer ARNs
            const envFile = fs.readFileSync('dist/nr_tmp_env.sh', 'utf8');
            
            // Parse layer ARNs from the file
            const layerArns = {};
            envFile.split('\n').forEach(line => {
              const match = line.match(/export LAYER_ARN_(\w+)='([^']+)'/);
              if (match) {
                layerArns[match[1]] = match[2];
              }
            });
            
            // Build comment body
            let commentBody = '## 🚀 Test Lambda Layers Published\n\n';
            commentBody += `Test layers have been successfully published to **${process.env.AWS_REGION}** for this PR.\n\n`;
            commentBody += '### Layer ARNs\n\n';
            
            // Group by language
            const languages = {
              'Extension Only': [],
              'Python': [],
              'Node.js': [],
              'Java': [],
              '.NET': [],
              'Ruby': []
            };
            
            Object.entries(layerArns).forEach(([key, arn]) => {
              if (key.includes('EXTENSION') && !key.includes('PYTHON') && !key.includes('NODEJS')) {
                languages['Extension Only'].push({ key, arn });
              } else if (key.includes('PYTHON')) {
                languages['Python'].push({ key, arn });
              } else if (key.includes('NODEJS')) {
                languages['Node.js'].push({ key, arn });
              } else if (key.includes('JAVA')) {
                languages['Java'].push({ key, arn });
              } else if (key.includes('DOTNET')) {
                languages['.NET'].push({ key, arn });
              } else if (key.includes('RUBY')) {
                languages['Ruby'].push({ key, arn });
              }
            });
            
            // Format output
            for (const [lang, layers] of Object.entries(languages)) {
              if (layers.length > 0) {
                commentBody += `\n#### ${lang}\n\n`;
                layers.forEach(({ key, arn }) => {
                  const arch = key.includes('X86') ? 'x86_64' : 'arm64';
                  commentBody += `- **${arch}**: \`${arn}\`\n`;
                });
              }
            }
            
            commentBody += '\n### ⚠️ Test Layers Notice\n\n';
            commentBody += '> **These are TEST layers created specifically for this PR.** They are published to `us-west-1` for testing purposes only.\n\n';
            commentBody += '### Usage\n\n';
            commentBody += 'You can test these layers in your Lambda functions using the AWS CLI or Console.\n\n';
            commentBody += '**AWS CLI Example:**\n';
            commentBody += '```bash\n';
            commentBody += 'aws lambda update-function-configuration \\\n';
            commentBody += '  --function-name your-function-name \\\n';
            commentBody += '  --region us-west-1 \\\n';
            commentBody += '  --layers "<LAYER_ARN>"\n';
            commentBody += '```\n\n';
            commentBody += '---\n';
            commentBody += `*Test layers created from commit ${context.sha.substring(0, 7)} • Region: us-west-1*`;
            
            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

      - name: Upload layer ARNs as artifact
        if: steps.build_layers.outputs.layers_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-layer-arns
          path: dist/nr_tmp_env.sh
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.build_layers.outputs.layers_created }}" == "true" ]; then
            echo "✅ Test layers successfully built and published to us-west-1 and ca-central-1" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Layer ARNs" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Only print ARNs, never any secrets
            cat dist/nr_tmp_env.sh >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔒 AWS credentials are securely masked and never exposed in logs" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Failed to build test layers" >> $GITHUB_STEP_SUMMARY
          fi

  invoke-performance-tests:
    name: Run Performance Tests
    needs: build-test-layers
    runs-on: ubuntu-latest
    if: needs.build-test-layers.outputs.layers_created == 'true'

    permissions:
      contents: read

    env:
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1

    strategy:
      matrix:
        runtime: [node, python, go, ruby, java, dotnet]
        test_mode: [serverless, apm]
      fail-fast: false
      max-parallel: 12  # Run all 12 combinations in parallel (separate Lambda functions)

    steps:
      - name: Set Layer ARNs for ${{ matrix.runtime }}
        id: set_arns
        run: |
          case "${{ matrix.runtime }}" in
            node)
              echo "x86_arn=${{ needs.build-test-layers.outputs.nodejs_x86_arn }}" >> $GITHUB_OUTPUT
              echo "arm_arn=${{ needs.build-test-layers.outputs.nodejs_arm_arn }}" >> $GITHUB_OUTPUT
              ;;
            python)
              echo "x86_arn=${{ needs.build-test-layers.outputs.python_x86_arn }}" >> $GITHUB_OUTPUT
              echo "arm_arn=${{ needs.build-test-layers.outputs.python_arm_arn }}" >> $GITHUB_OUTPUT
              ;;
            java)
              echo "x86_arn=${{ needs.build-test-layers.outputs.java_x86_arn }}" >> $GITHUB_OUTPUT
              echo "arm_arn=${{ needs.build-test-layers.outputs.java_arm_arn }}" >> $GITHUB_OUTPUT
              ;;
            dotnet)
              echo "x86_arn=${{ needs.build-test-layers.outputs.dotnet_x86_arn }}" >> $GITHUB_OUTPUT
              echo "arm_arn=${{ needs.build-test-layers.outputs.dotnet_arm_arn }}" >> $GITHUB_OUTPUT
              ;;
            ruby)
              echo "x86_arn=${{ needs.build-test-layers.outputs.ruby_x86_arn }}" >> $GITHUB_OUTPUT
              echo "arm_arn=${{ needs.build-test-layers.outputs.ruby_arm_arn }}" >> $GITHUB_OUTPUT
              ;;
            go)
              # Go uses extension-only layer
              echo "x86_arn=${{ needs.build-test-layers.outputs.extension_x86_arn }}" >> $GITHUB_OUTPUT
              echo "arm_arn=${{ needs.build-test-layers.outputs.extension_arm_arn }}" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Run Cold Start Test - ${{ matrix.runtime }} (${{ matrix.test_mode }})
        env:
          API_URL: ${{ secrets.LAMBDA_PERF_TEST_API_URL }}
          API_KEY: ${{ secrets.LAMBDA_PERF_TEST_API_KEY }}
        run: |
          # Set correct AWS region
          export AWS_DEFAULT_REGION=ca-central-1
          export AWS_REGION=ca-central-1

          echo "🧪 Running COLD start test for ${{ matrix.runtime }} in ${{ matrix.test_mode }} mode"
          echo "Region: $AWS_REGION"
          echo "x86 Layer: ${{ steps.set_arns.outputs.x86_arn }}"
          echo "arm Layer: ${{ steps.set_arns.outputs.arm_arn }}"

          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: $API_KEY" \
            --data "{
              \"runtime\": \"${{ matrix.runtime }}\",
              \"test_mode\": \"${{ matrix.test_mode }}\",
              \"test_type\": \"cold\",
              \"x86_layer_arn\": \"${{ steps.set_arns.outputs.x86_arn }}\",
              \"arm_layer_arn\": \"${{ steps.set_arns.outputs.arm_arn }}\"
            }" \
            "$API_URL")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response code: $http_code"
          echo "Response body: $body"
          
          if [ "$http_code" != "200" ]; then
            echo "❌ Cold start test failed with HTTP $http_code"
          fi
          echo "✅ Cold start test initiated successfully"

      - name: Wait for Cold Start completion
        run: |
          echo "⏳ Waiting 8 minutes for cold start tests to complete and functions to cool down..."
          sleep 480

      - name: Run Warm Start Test - ${{ matrix.runtime }} (${{ matrix.test_mode }})
        env:
          API_URL: ${{ secrets.LAMBDA_PERF_TEST_API_URL }}
          API_KEY: ${{ secrets.LAMBDA_PERF_TEST_API_KEY }}
        run: |
          # Set correct AWS region
          export AWS_DEFAULT_REGION=ca-central-1
          export AWS_REGION=ca-central-1

          echo "🔥 Running WARM start test for ${{ matrix.runtime }} in ${{ matrix.test_mode }} mode"
          echo "Region: $AWS_REGION"

          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: $API_KEY" \
            --data "{
              \"runtime\": \"${{ matrix.runtime }}\",
              \"test_mode\": \"${{ matrix.test_mode }}\",
              \"test_type\": \"warm\",
              \"x86_layer_arn\": \"${{ steps.set_arns.outputs.x86_arn }}\",
              \"arm_layer_arn\": \"${{ steps.set_arns.outputs.arm_arn }}\"
            }" \
            "$API_URL")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response code: $http_code"
          echo "Response body: $body"
          
          if [ "$http_code" != "200" ]; then
            echo "❌ Warm start test failed with HTTP $http_code"
          fi
          echo "✅ Warm start test initiated successfully"

      - name: Wait for Warm Start completion
        run: |
          echo "⏳ Waiting 8 minutes for warm start tests to complete..."
          sleep 480

      - name: Run Logs Test - ${{ matrix.runtime }} (${{ matrix.test_mode }})
        env:
          API_URL: ${{ secrets.LAMBDA_PERF_TEST_API_URL }}
          API_KEY: ${{ secrets.LAMBDA_PERF_TEST_API_KEY }}
        run: |
          # Set correct AWS region
          export AWS_DEFAULT_REGION=ca-central-1
          export AWS_REGION=ca-central-1

          echo "📝 Running LOGS test for ${{ matrix.runtime }} in ${{ matrix.test_mode }} mode"
          echo "Region: $AWS_REGION"

          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: $API_KEY" \
            --data "{
              \"runtime\": \"${{ matrix.runtime }}\",
              \"test_mode\": \"${{ matrix.test_mode }}\",
              \"test_type\": \"logs\",
              \"x86_layer_arn\": \"${{ steps.set_arns.outputs.x86_arn }}\",
              \"arm_layer_arn\": \"${{ steps.set_arns.outputs.arm_arn }}\"
            }" \
            "$API_URL")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response code: $http_code"
          echo "Response body: $body"
          
          if [ "$http_code" != "200" ]; then
            echo "❌ Logs test failed with HTTP $http_code"
          fi
          echo "✅ Logs test initiated successfully"

      - name: Test Summary
        if: always()
        run: |
          echo "## Performance Tests - ${{ matrix.runtime }} (${{ matrix.test_mode }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All test types completed sequentially:" >> $GITHUB_STEP_SUMMARY
          echo "  1. Cold start test → 8 min wait" >> $GITHUB_STEP_SUMMARY
          echo "  2. Warm start test → 8 min wait" >> $GITHUB_STEP_SUMMARY
          echo "  3. Logs test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 View detailed results in New Relic custom events: \`LambdaExtensionPerformance\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Runtime: ${{ matrix.runtime }}" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: ${{ matrix.test_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- x86 Layer: \`${{ steps.set_arns.outputs.x86_arn }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ARM Layer: \`${{ steps.set_arns.outputs.arm_arn }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Total time per job: ~16-20 minutes (all 12 jobs run in parallel)_" >> $GITHUB_STEP_SUMMARY
