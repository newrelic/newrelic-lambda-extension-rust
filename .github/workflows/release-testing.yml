name: Release Testing

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TEST_REGION: ca-central-1

jobs:
  publish-production-layers:
    name: Build and Publish Production Layers
    runs-on: ubuntu-latest
    
    outputs:
      extension_x86_arn: ${{ steps.capture_arns.outputs.extension_x86_arn }}
      extension_arm_arn: ${{ steps.capture_arns.outputs.extension_arm_arn }}
      python_x86_arn: ${{ steps.capture_arns.outputs.python_x86_arn }}
      python_arm_arn: ${{ steps.capture_arns.outputs.python_arm_arn }}
      nodejs_x86_arn: ${{ steps.capture_arns.outputs.nodejs_x86_arn }}
      nodejs_arm_arn: ${{ steps.capture_arns.outputs.nodejs_arm_arn }}
      java_x86_arn: ${{ steps.capture_arns.outputs.java_x86_arn }}
      java_arm_arn: ${{ steps.capture_arns.outputs.java_arm_arn }}
      dotnet_x86_arn: ${{ steps.capture_arns.outputs.dotnet_x86_arn }}
      dotnet_arm_arn: ${{ steps.capture_arns.outputs.dotnet_arm_arn }}
      ruby_x86_arn: ${{ steps.capture_arns.outputs.ruby_x86_arn }}
      ruby_arm_arn: ${{ steps.capture_arns.outputs.ruby_arm_arn }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mask sensitive data
        run: |
          echo "::add-mask::${{ secrets.AWS_ACCESS_KEY_ID }}"
           echo "::add-mask::${{ secrets.AWS_SECRET_ACCESS_KEY }}"

      - name: Extract extension version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | awk -F'"' '{print $2}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Add Rust targets
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: 'scripts/ruby'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          gem install bundler
          pip3 install --upgrade pip awscli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.TEST_REGION }}

      - name: Build and publish production layers
        id: publish
        env:
          AWS_DEFAULT_REGION: ${{ env.TEST_REGION }}
          EXTENSION_VERSION: ${{ steps.version.outputs.version }}
          # Set for production build (no TEST_MODE)
          LAYER_NAME_PREFIX: "NewRelicLambdaRustExtension"
          BUCKET_PREFIX: "nr-extension-prod-layers"
          REGIONS_X86_64: "ca-central-1"
          REGIONS_ARM64: "ca-central-1"
          LANGUAGES: "extension python nodejs java dotnet ruby"
        run: |
          chmod +x scripts/createlayer.sh
          ./scripts/createlayer.sh
          
          if [ -f dist/nr_tmp_env.sh ]; then
            echo "✓ Production layers published successfully"
            cat dist/nr_tmp_env.sh
           else
            echo "✗ Failed to generate layer ARNs"
            exit 1
          fi

      - name: Capture Layer ARNs for testing
        id: capture_arns
        run: |
          source dist/nr_tmp_env.sh
          echo "extension_x86_arn=${LAYER_ARN_EXTENSION_X86_64:-}" >> $GITHUB_OUTPUT
          echo "extension_arm_arn=${LAYER_ARN_EXTENSION_ARM64:-}" >> $GITHUB_OUTPUT
          echo "python_x86_arn=${LAYER_ARN_PYTHON_X86_64:-}" >> $GITHUB_OUTPUT
          echo "python_arm_arn=${LAYER_ARN_PYTHON_ARM64:-}" >> $GITHUB_OUTPUT
          echo "nodejs_x86_arn=${LAYER_ARN_NODEJS_X86_64:-}" >> $GITHUB_OUTPUT
          echo "nodejs_arm_arn=${LAYER_ARN_NODEJS_ARM64:-}" >> $GITHUB_OUTPUT
          echo "java_x86_arn=${LAYER_ARN_JAVA_X86_64:-}" >> $GITHUB_OUTPUT
          echo "java_arm_arn=${LAYER_ARN_JAVA_ARM64:-}" >> $GITHUB_OUTPUT
          echo "dotnet_x86_arn=${LAYER_ARN_DOTNET_X86_64:-}" >> $GITHUB_OUTPUT
          echo "dotnet_arm_arn=${LAYER_ARN_DOTNET_ARM64:-}" >> $GITHUB_OUTPUT
          echo "ruby_x86_arn=${LAYER_ARN_RUBY_X86_64:-}" >> $GITHUB_OUTPUT
          echo "ruby_arm_arn=${LAYER_ARN_RUBY_ARM64:-}" >> $GITHUB_OUTPUT

  test-production-layers:
    name: Test Production Layers (ca-central-1)
    needs: publish-production-layers
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1

    strategy:
      matrix:
        runtime: [node, python, go, ruby, java, dotnet]
        test_mode: [serverless, apm]
      fail-fast: false
      max-parallel: 12

    steps:
      - name: Set Layer ARNs for ${{ matrix.runtime }}
        id: set_arns
        run: |
          case "${{ matrix.runtime }}" in
            node)
              echo "x86_arn=${{ needs.publish-production-layers.outputs.nodejs_x86_arn }}" >> $GITHUB_OUTPUT
              echo "arm_arn=${{ needs.publish-production-layers.outputs.nodejs_arm_arn }}" >> $GITHUB_OUTPUT
              ;;
            python)
              echo "x86_arn=${{ needs.publish-production-layers.outputs.python_x86_arn }}" >> $GITHUB_OUTPUT
              echo "arm_arn=${{ needs.publish-production-layers.outputs.python_arm_arn }}" >> $GITHUB_OUTPUT
              ;;
            java)
              echo "x86_arn=${{ needs.publish-production-layers.outputs.java_x86_arn }}" >> $GITHUB_OUTPUT
              echo "arm_arn=${{ needs.publish-production-layers.outputs.java_arm_arn }}" >> $GITHUB_OUTPUT
              ;;
            dotnet)
              echo "x86_arn=${{ needs.publish-production-layers.outputs.dotnet_x86_arn }}" >> $GITHUB_OUTPUT
              echo "arm_arn=${{ needs.publish-production-layers.outputs.dotnet_arm_arn }}" >> $GITHUB_OUTPUT
              ;;
            ruby)
              echo "x86_arn=${{ needs.publish-production-layers.outputs.ruby_x86_arn }}" >> $GITHUB_OUTPUT
              echo "arm_arn=${{ needs.publish-production-layers.outputs.ruby_arm_arn }}" >> $GITHUB_OUTPUT
              ;;
            go)
              echo "x86_arn=${{ needs.publish-production-layers.outputs.extension_x86_arn }}" >> $GITHUB_OUTPUT
              echo "arm_arn=${{ needs.publish-production-layers.outputs.extension_arm_arn }}" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Run Cold Start Test - ${{ matrix.runtime }} (${{ matrix.test_mode }})
        env:
          API_URL: ${{ secrets.LAMBDA_PERF_TEST_API_URL }}
          API_KEY: ${{ secrets.LAMBDA_PERF_TEST_API_KEY }}
        run: |
          # Set correct AWS region
          export AWS_DEFAULT_REGION=ca-central-1
          export AWS_REGION=ca-central-1

          echo "🧪 Running COLD start test for ${{ matrix.runtime }} in ${{ matrix.test_mode }} mode"
          echo "Region: $AWS_REGION"
          echo "x86 Layer: ${{ steps.set_arns.outputs.x86_arn }}"
          echo "arm Layer: ${{ steps.set_arns.outputs.arm_arn }}"

          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: $API_KEY" \
            --data "{
              \"runtime\": \"${{ matrix.runtime }}\",
              \"test_mode\": \"${{ matrix.test_mode }}\",
              \"test_type\": \"cold\",
              \"x86_layer_arn\": \"${{ steps.set_arns.outputs.x86_arn }}\",
              \"arm_layer_arn\": \"${{ steps.set_arns.outputs.arm_arn }}\"
            }" \
            "$API_URL")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response code: $http_code"
          echo "Response body: $body"
          
          if [ "$http_code" != "200" ]; then
            echo "❌ Cold start test failed with HTTP $http_code"
          fi
          echo "✅ Cold start test initiated successfully"

      - name: Wait for Cold Start completion
        run: |
          echo "⏳ Waiting 8 minutes for cold start tests to complete and functions to cool down..."
          sleep 480

      - name: Run Warm Start Test - ${{ matrix.runtime }} (${{ matrix.test_mode }})
        env:
          API_URL: ${{ secrets.LAMBDA_PERF_TEST_API_URL }}
          API_KEY: ${{ secrets.LAMBDA_PERF_TEST_API_KEY }}
        run: |
          # Set correct AWS region
          export AWS_DEFAULT_REGION=ca-central-1
          export AWS_REGION=ca-central-1

          echo "🔥 Running WARM start test for ${{ matrix.runtime }} in ${{ matrix.test_mode }} mode"
          echo "Region: $AWS_REGION"

          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: $API_KEY" \
            --data "{
              \"runtime\": \"${{ matrix.runtime }}\",
              \"test_mode\": \"${{ matrix.test_mode }}\",
              \"test_type\": \"warm\",
              \"x86_layer_arn\": \"${{ steps.set_arns.outputs.x86_arn }}\",
              \"arm_layer_arn\": \"${{ steps.set_arns.outputs.arm_arn }}\"
            }" \
            "$API_URL")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response code: $http_code"
          echo "Response body: $body"

          if [ "$http_code" != "200" ]; then
            echo "❌ Warm start test failed with HTTP $http_code"
          fi
          echo "✅ Warm start test initiated successfully"

      - name: Wait for Warm Start completion
        run: |
          echo "⏳ Waiting 8 minutes for warm start tests to complete..."
          sleep 480

      - name: Run Logs Test - ${{ matrix.runtime }} (${{ matrix.test_mode }})
        env:
          API_URL: ${{ secrets.LAMBDA_PERF_TEST_API_URL }}
          API_KEY: ${{ secrets.LAMBDA_PERF_TEST_API_KEY }}
        run: |
          # Set correct AWS region
          export AWS_DEFAULT_REGION=ca-central-1
          export AWS_REGION=ca-central-1

          echo "📝 Running LOGS test for ${{ matrix.runtime }} in ${{ matrix.test_mode }} mode"
          echo "Region: $AWS_REGION"

          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: $API_KEY" \
            --data "{
              \"runtime\": \"${{ matrix.runtime }}\",
              \"test_mode\": \"${{ matrix.test_mode }}\",
              \"test_type\": \"logs\",
              \"x86_layer_arn\": \"${{ steps.set_arns.outputs.x86_arn }}\",
              \"arm_layer_arn\": \"${{ steps.set_arns.outputs.arm_arn }}\"
            }" \
            "$API_URL")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response code: $http_code"
          echo "Response body: $body"

          if [ "$http_code" != "200" ]; then
            echo "❌ Logs test failed with HTTP $http_code"
          fi
          echo "✅ Logs test initiated successfully"

      - name: Test Summary
        if: always()
        run: |
          echo "## Performance Tests - ${{ matrix.runtime }} (${{ matrix.test_mode }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Production layer tests completed:" >> $GITHUB_STEP_SUMMARY
          echo "  1. Cold start test → 8 min wait" >> $GITHUB_STEP_SUMMARY
          echo "  2. Warm start test → 8 min wait" >> $GITHUB_STEP_SUMMARY
          echo "  3. Logs test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 View results in New Relic: \`LambdaExtensionPerformance\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ca-central-1" >> $GITHUB_STEP_SUMMARY
          echo "**Runtime:** ${{ matrix.runtime }}" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ matrix.test_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "**x86 Layer:** \`${{ steps.set_arns.outputs.x86_arn }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**ARM Layer:** \`${{ steps.set_arns.outputs.arm_arn }}\`" >> $GITHUB_STEP_SUMMARY
