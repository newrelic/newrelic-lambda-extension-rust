[package]
name = "newrelic-lambda-extension"
version = "2.6.0"
edition = "2021"
authors = ["Lambda Serverless Team"]
description = "AWS Lambda Extension for New Relic monitoring integration"
license = "Apache-2.0"
repository = "https://github.com/newrelic/newrelic-lambda-extension-rust"
readme = "README.md"

[dependencies]
# Tokio - only load what we actually use (massive startup time improvement)
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
# Reqwest - use newer version to match AWS SDK and reduce duplicates
reqwest = { version = "0.13.1", features = ["json", "rustls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Hyper - use v1 to match AWS SDK (eliminates duplicate hyper 0.14)
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "service"] }
# Use http v1 to match AWS SDK
http-body-util = "0.1"
flate2 = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.31.1", features = ["fs"] }
base64 = "0.22"  # Use newer version to match AWS SDK
anyhow = "1.0"
once_cell = "1.19"
dashmap = "6.1"
bytes = "1.11"
regex = "1.10"  # For parsing platform REPORT logs in APM mode
rand = "0.9.3"  # For TraceID/SpanID generation in APM mode

# AWS dependencies - ALWAYS INCLUDED as default (as you requested)
aws-config = { version = "1.8", features = ["behavior-version-latest"] }
aws-sdk-secretsmanager = { version = "1.88", features = ["behavior-version-latest"] }
aws-sdk-ssm = { version = "1.93", features = ["behavior-version-latest"] }
aws-sdk-lambda = { version = "1.66", features = ["behavior-version-latest"] }

[profile.release]
lto = "fat"          # Maximum link-time optimization
codegen-units = 1    # Single codegen unit for better optimization
opt-level = "z"      # Optimize for size (important for Lambda cold starts)
strip = true         # Strip debug symbols
panic = "unwind"     # Allow panic catching to prevent Lambda crashes (changed from "abort")
debug = false        # No debug info in release

# Optimize dependencies for release builds - aggressive settings
[profile.release.package."*"]
opt-level = 3
debug = false

# Optimize AWS dependencies specifically for size and speed
[profile.release.package.aws-config]
opt-level = "z"

[profile.release.package.aws-sdk-secretsmanager]
opt-level = "z"

[profile.release.package.aws-sdk-ssm]
opt-level = "z"

# Dev profile optimizations for faster development
[profile.dev]
opt-level = 1  # Some optimization for better development experience

[dev-dependencies]
serial_test = "3.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
