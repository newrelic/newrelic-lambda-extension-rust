[package]
name = "newrelic-lambda-extension"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "AWS Lambda Extension for New Relic monitoring integration"
license = "Apache-2.0"
repository = "https://github.com/yourusername/newrelic-lambda-extension"
readme = "README.md"

[dependencies]
lambda-extension = "0.12.2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tower = "0.5"
hyper = { version = "0.14", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "logging", "ring", "webpki-roots"] }
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tikv-jemallocator = "0.5"
bytes = "1.0"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"  # Optimize for size (important for Lambda cold starts)
strip = true
panic = "abort"  # Reduce binary size and improve performance

# Optimize dependencies for release builds
[profile.release.package."*"]
opt-level = 3

# Dev profile optimizations for faster development
[profile.dev]
opt-level = 1  # Some optimization for better development experience